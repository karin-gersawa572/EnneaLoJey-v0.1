<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI ENGINE V2.3 - UI Optimized</title>
    <style>
        :root {
            --bg: #0a0a0a; --panel: #161616; --text: #ffffff; --border: #222;
            --btn-bg: #333; --n3: #2ecc71; --accent-grey: #808080; --accent-red: #ff4d4d;
            --code-green: #2ecc71; --code-quote: #ffffff;
        }
        body {
            margin: 0; padding: 0; background: var(--bg); color: var(--text);
            font-family: 'Consolas', 'Courier New', monospace; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        header { 
            padding: 15px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); background: var(--panel);
        }
        h1 { margin: 0; font-size: 1rem; color: var(--n3); letter-spacing: 2px; }

        main { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            padding-bottom: 60vh; 
            scroll-behavior: smooth;
        }
        .section-label { font-size: 0.65rem; font-weight: bold; color: var(--accent-grey); margin-bottom: 8px; display: block; text-transform: uppercase; }

        .card { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        
        .editor-area {
            width: 100%; min-height: 250px; background: #000; color: #fff; border: 1px solid var(--border); 
            padding: 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.5;
            box-sizing: border-box; overflow-y: auto; outline: none; white-space: pre-wrap;
        }
        #raw-input { height: 250px; resize: none; font-family: inherit; }
        #standards-editor { height: 350px; font-family: inherit; }

        .hl-cmd { color: var(--code-green); }
        .hl-str { color: var(--code-quote); font-weight: bold; }

        .collective-box { 
            background: #000; border: 1px solid var(--border);
            border-left: 4px solid var(--n3); padding: 15px; border-radius: 4px;
            min-height: 200px; line-height: 1.8; font-size: 1rem; color: #fff; outline: none;
            overflow-wrap: break-word;
        }

        .ai-text { color: var(--accent-grey); }
        .user-text { color: #fff; }
        .token-mark { font-size: 0.7rem; opacity: 0.3; margin-left: 2px; font-style: italic; }
        .code-hidden .token-mark { display: none; }

        nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            height: 70px; background: var(--panel); 
            display: flex; border-top: 1px solid var(--border); z-index: 1000; 
        }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--accent-grey); font-size: 0.6rem; cursor: pointer; font-weight: bold; }
        .nav-btn.active { color: var(--n3); }

        button { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: inherit; transition: 0.2s; }
        button:active { opacity: 0.7; }
        .btn-n3 { background: var(--n3); color: #000; flex: 2; }
        .btn-toggle { background: var(--btn-bg); color: #fff; flex: 1; font-size: 0.7rem; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }

        .bottom-spacer { height: 40vh; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>CORE_V2.3_FINAL</h1>
        <small id="status" style="color:var(--accent-grey); font-size:0.5rem;">[PARSER_READY]</small>
    </div>
</header>

<main id="main-content">
    <div id="tab-engine">
        <span class="section-label">Input_Buffer</span>
        <div class="card">
            <textarea id="raw-input" class="editor-area" placeholder="Input kode (mis: sx1) atau /code='x'/= manual..."></textarea>
            <div class="btn-group">
                <button class="btn-n3" onclick="runEngine()">EXECUTE_SEQUENCE</button>
                <button class="btn-toggle" onclick="toggleCode()" id="view-btn">HIDE_TK</button>
            </div>
        </div>

        <span class="section-label">Collective_Display</span>
        <div id="output-box" class="collective-box" contenteditable="true">
            <span style="color:#333;">// Waiting for sequence execution...</span>
        </div>
    </div>

    <div id="tab-standards" style="display:none;">
        <span class="section-label">Database_Manual_Override</span>
        <div class="card">
            <div id="standards-editor" class="editor-area" contenteditable="true" oninput="handleStandardsInput()"></div>
            <p style="font-size: 0.5rem; color: var(--accent-grey); margin-top: 8px;">SYNTX: /code="key"/= value</p>
        </div>
    </div>

    <div class="bottom-spacer"></div>
</main>

<nav>
    <div class="nav-btn active" onclick="switchTab('engine')">ENGINE_SYS</div>
    <div class="nav-btn" onclick="switchTab('standards')">DB_STANDARDS</div>
</nav>

<script>
    let standards = {
        "sx": "Secara dekat,",
        "1": "ingin sempurna",
        "w2": "dengan mempelajari gaya k",
        "w9": "dengan memperhatikan lingkungan"
    };
    let isCodeHidden = false;

    function handleStandardsInput() {
        const editor = document.getElementById('standards-editor');
        const pos = getCaretPosition(editor);
        const text = editor.innerText;
        
        const newStandards = {};
        const lines = text.split('\n');
        lines.forEach(line => {
            const match = line.match(/\/code="([^"]+)"\/=\s*(.*)/);
            if(match) newStandards[match[1]] = match[2];
        });
        standards = newStandards;

        const highlighted = text.split('\n').map(line => {
            return line.replace(/(\/code=)"([^"]+)"(\/=)/g, '<span class="hl-cmd">$1</span>"<span class="hl-str">$2</span>"<span class="hl-cmd">$3</span>');
        }).join('\n');

        editor.innerHTML = highlighted;
        restoreCaretPosition(editor, pos);
    }

    function initStandardsEditor() {
        const editor = document.getElementById('standards-editor');
        let html = "";
        Object.keys(standards).sort().forEach(k => {
            html += `<span class="hl-cmd">/code=</span>"<span class="hl-str">${k}</span>"<span class="hl-cmd">/=</span> ${standards[k]}\n`;
        });
        editor.innerHTML = html;
    }

    function runEngine() {
        const raw = document.getElementById('raw-input').value.trim();
        if(!raw) return;

        const box = document.getElementById('output-box');
        box.innerHTML = "";

        const lines = raw.split('\n');
        const sortedKeys = Object.keys(standards).sort((a, b) => b.length - a.length);

        lines.forEach((line) => {
            const container = document.createElement('div');
            const cmdMatch = line.match(/^\/code="([^"]+)"\/=\s*(.*)/);
            
            if(cmdMatch) {
                const code = cmdMatch[1];
                const extra = cmdMatch[2];
                if(standards[code]) {
                    container.innerHTML = `<span class="ai-text">${standards[code]}<span class="token-mark">[${code}]</span></span> <span class="user-text">${extra}</span>`;
                } else {
                    container.innerHTML = `<span class="user-text">${line}</span>`;
                }
            } else {
                if(sortedKeys.length > 0) {
                    const regex = new RegExp(`(${sortedKeys.join('|')})`, 'g');
                    let parts = line.split(regex);
                    parts.forEach(part => {
                        if(standards[part]) {
                            const span = document.createElement('span');
                            span.className = 'ai-text';
                            span.innerHTML = `${standards[part]}<span class="token-mark">[${part}]</span> `;
                            container.appendChild(span);
                        } else if(part !== "") {
                            const span = document.createElement('span');
                            span.className = 'user-text';
                            span.innerText = part;
                            container.appendChild(span);
                        }
                    });
                } else {
                    container.className = 'user-text';
                    container.innerText = line;
                }
            }
            box.appendChild(container);
        });

        document.getElementById('status').innerText = "[SEQUENCE_SUCCESS]";
        setTimeout(() => {
            box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    function switchTab(t) {
        document.getElementById('tab-engine').style.display = t === 'engine' ? 'block' : 'none';
        document.getElementById('tab-standards').style.display = t === 'standards' ? 'block' : 'none';
        document.querySelectorAll('.nav-btn').forEach((btn, i) => {
            btn.classList.toggle('active', (t === 'engine' && i === 0) || (t === 'standards' && i === 1));
        });
        if(t === 'standards') initStandardsEditor();
    }

    function toggleCode() {
        isCodeHidden = !isCodeHidden;
        document.getElementById('output-box').classList.toggle('code-hidden', isCodeHidden);
        document.getElementById('view-btn').innerText = isCodeHidden ? "SHOW_TK" : "HIDE_TK";
    }

    function getCaretPosition(element) {
        let position = 0;
        const selection = window.getSelection();
        if (selection.rangeCount !== 0) {
            const range = window.getSelection().getRangeAt(0);
            const preCaretRange = range.cloneRange();
            preCaretRange.selectNodeContents(element);
            preCaretRange.setEnd(range.endContainer, range.endOffset);
            position = preCaretRange.toString().length;
        }
        return position;
    }

    function restoreCaretPosition(element, position) {
        let charCount = 0;
        const range = document.createRange();
        range.setStart(element, 0);
        range.collapse(true);
        const nodeStack = [element];
        let node, found = false, stop = false;
        while (!stop && (node = nodeStack.pop())) {
            if (node.nodeType === 3) {
                const nextCharCount = charCount + node.length;
                if (!found && position <= nextCharCount) {
                    range.setStart(node, position - charCount);
                    range.setEnd(node, position - charCount);
                    stop = true; found = true;
                }
                charCount = nextCharCount;
            } else {
                let i = node.childNodes.length;
                while (i--) nodeStack.push(node.childNodes[i]);
            }
        }
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    }

    window.onload = initStandardsEditor;
</script>
</body>
</html>
